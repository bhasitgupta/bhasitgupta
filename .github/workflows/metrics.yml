name: GitHub Metrics

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'profile-3d-contrib/**'
      - 'images/**'
      - 'github-metrics.svg'

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub Metrics
        uses: lowlighter/metrics@v3.34

        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: bhasitgupta
          filename: github-metrics.svg

          template: classic
          config_timezone: Asia/Kolkata
          config_display: large

          base: header, activity, community, repositories

          # Contribution iso-calendar (half-year heatmap)
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          # Most-used languages with bytes and percentage
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_indepth: yes
          plugin_languages_categories: markup, programming

          # Starred topics
          plugin_topics: yes
          plugin_topics_limit: 20
          plugin_topics_mode: icons

          # Code habits (commit times, wakatime-style)
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_facts: yes
          plugin_habits_charts: yes

          # Lines of code added/deleted
          plugin_lines: yes

          # Repository highlights
          plugin_repositories: yes
          plugin_repositories_featured: bhasitgupta/Draftdeckai, bhasitgupta/Glitchless, bhasitgupta/SecureChain

          # Don't fail entire workflow if one plugin fails
          plugins_errors_fatal: no
