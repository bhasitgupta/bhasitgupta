<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="100%" height="100%">
  <defs>
    <!-- Halftone Pattern -->
    <pattern id="halftone" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <circle cx="2" cy="2" r="2" fill="#FF003C" fill-opacity="0.35" />
      <circle cx="10" cy="10" r="1.2" fill="#FFFFFF" fill-opacity="0.2" />
    </pattern>

    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.2" fill="#2A0812" />
    </pattern>

    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050507" />
      <stop offset="40%" stop-color="#0c070a" />
      <stop offset="100%" stop-color="#030304" />
    </linearGradient>

    <linearGradient id="slashRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF003C" />
      <stop offset="50%" stop-color="#D90429" />
      <stop offset="100%" stop-color="#720015" />
    </linearGradient>

    <linearGradient id="glowRedGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF003C" stop-opacity="0" />
      <stop offset="50%" stop-color="#FF003C" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <radialGradient id="vignette" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#FF003C" stop-opacity="0.12" />
      <stop offset="70%" stop-color="#000000" stop-opacity="0" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.75" />
    </radialGradient>

    <!-- Filter -->
    <filter id="hardShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="6" dy="8" stdDeviation="0" flood-color="#FF003C" flood-opacity="1" />
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseFlash {
      0%, 100% { opacity: 0.9; }
      50% { opacity: 0.5; }
    }
    @keyframes speedDash {
      0% { stroke-dashoffset: 800; }
      100% { stroke-dashoffset: -800; }
    }
    @keyframes scanBeam {
      0% { transform: translateY(-440px); opacity: 0; }
      20% { opacity: 0.8; }
      80% { opacity: 0.8; }
      100% { transform: translateY(440px); opacity: 0; }
    }

    .manga-title {
      font-family: 'Impact', 'Arial Black', -apple-system, sans-serif;
      font-size: 78px;
      font-weight: 900;
      letter-spacing: 6px;
      fill: #FFFFFF;
      text-transform: uppercase;
    }
    .manga-subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Montserrat', sans-serif;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 5px;
      fill: #FFFFFF;
      text-transform: uppercase;
    }
    .hud-label {
      font-family: 'Courier New', monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      fill: #FF003C;
    }
    .speed-line {
      stroke: #FF003C;
      stroke-dasharray: 120 80;
      animation: speedDash 6s linear infinite;
    }
    .flash {
      animation: pulseFlash 3s ease-in-out infinite;
    }
    .scanner {
      animation: scanBeam 6s linear infinite;
    }
  </style>

  <!-- Canvas Background -->
  <rect width="1200" height="440" fill="url(#bgGrad)" />
  <rect width="1200" height="440" fill="url(#dotGrid)" />

  <!-- Manga Speed Lines & Slashes -->
  <g opacity="0.35">
    <line x1="-100" y1="40" x2="1300" y2="120" stroke="#FF003C" stroke-width="1.5" class="speed-line" />
    <line x1="-100" y1="180" x2="1300" y2="260" stroke="#FFFFFF" stroke-width="0.8" opacity="0.4" />
    <line x1="-100" y1="360" x2="1300" y2="440" stroke="#FF003C" stroke-width="2" class="speed-line" />
    <line x1="200" y1="-50" x2="40" y2="500" stroke="#FF003C" stroke-width="1" opacity="0.3" />
    <line x1="1020" y1="-50" x2="860" y2="500" stroke="#FF003C" stroke-width="1.5" opacity="0.4" />
  </g>

  <!-- Halftone Decorative Blocks -->
  <polygon points="0,0 260,0 180,440 0,440" fill="url(#halftone)" opacity="0.4" />
  <polygon points="980,0 1200,0 1200,440 1060,440" fill="url(#halftone)" opacity="0.35" />

  <!-- Slashed Crimson Background Plate -->
  <g transform="skewX(-16) translate(100, 0)">
    <polygon points="260,110 940,110 910,290 230,290" fill="#0A0A0E" stroke="#FF003C" stroke-width="3" />
    <polygon points="275,125 925,125 900,275 250,275" fill="#14060B" opacity="0.8" />
    <!-- Dynamic Red Accent Stripe -->
    <polygon points="230,285 910,285 900,305 220,305" fill="url(#slashRed)" />
  </g>

  <!-- Ambient Vignette -->
  <rect width="1200" height="440" fill="url(#vignette)" />

  <!-- Dynamic Slashed Tag Ribbon (Top) -->
  <g transform="translate(600, 75)">
    <polygon points="-240,-16 240,-16 220,16 -260,16" fill="url(#slashRed)" />
    <text x="0" y="5" text-anchor="middle" font-family="'Impact', sans-serif" font-size="14" letter-spacing="3" fill="#FFFFFF">
      ⚡ FULL-STACK ARCHITECT // AI SYSTEMS BUILDER // PRODUCT MAKER
    </text>
  </g>

  <!-- High-Impact Bold Title: BHASIT GUPTA -->
  <g transform="translate(600, 215)" text-anchor="middle">
    <!-- Crimson Hard Drop Shadow -->
    <text x="5" y="5" class="manga-title" fill="#FF003C" opacity="0.9">BHASIT GUPTA</text>
    <!-- Crisp Foreground Title -->
    <text x="0" y="0" class="manga-title">BHASIT GUPTA</text>
  </g>

  <!-- Subtitle Line inside Black/Red Banner -->
  <g transform="translate(600, 260)" text-anchor="middle">
    <text x="0" y="0" class="manga-subtitle" fill="#E2E8F0">
      TURNING COMPLEX CODE &amp; AI INTO SCALABLE PRODUCTS
    </text>
  </g>

  <!-- 3 Pill Badges (Design, Architecture, AI) -->
  <g transform="translate(600, 345)">
    <!-- Pill 1 -->
    <g transform="translate(-320, 0)">
      <polygon points="-120,-16 120,-16 108,16 -132,16" fill="#0A0A0C" stroke="#FF003C" stroke-width="1.8" />
      <text x="-6" y="5" text-anchor="middle" font-family="'Arial Black', sans-serif" font-size="11" fill="#FFFFFF" letter-spacing="1">
        💻 FULL-STACK DEV
      </text>
    </g>

    <!-- Pill 2 -->
    <g transform="translate(0, 0)">
      <polygon points="-140,-16 140,-16 128,16 -152,16" fill="url(#slashRed)" />
      <text x="-6" y="5" text-anchor="middle" font-family="'Arial Black', sans-serif" font-size="11" fill="#FFFFFF" letter-spacing="1">
        🤖 AI &amp; SYSTEM ARCHITECT
      </text>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(320, 0)">
      <polygon points="-120,-16 120,-16 108,16 -132,16" fill="#0A0A0C" stroke="#FF003C" stroke-width="1.8" />
      <text x="-6" y="5" text-anchor="middle" font-family="'Arial Black', sans-serif" font-size="11" fill="#FFFFFF" letter-spacing="1">
        🚀 PRODUCT MAKER
      </text>
    </g>
  </g>

  <!-- Tech Telemetry Borders & Crosshairs -->
  <g stroke="#FF003C" stroke-width="2" fill="none" class="flash">
    <!-- Top-Left Bracket -->
    <path d="M 25 60 L 25 25 L 60 25" />
    <!-- Top-Right Bracket -->
    <path d="M 1175 60 L 1175 25 L 1140 25" />
    <!-- Bottom-Left Bracket -->
    <path d="M 25 380 L 25 415 L 60 415" />
    <!-- Bottom-Right Bracket -->
    <path d="M 1175 380 L 1175 415 L 1140 415" />
  </g>

  <!-- Corner Decals -->
  <g transform="translate(50, 48)">
    <text x="0" y="0" class="hud-label">INIT // 01</text>
  </g>
  <g transform="translate(1080, 48)">
    <text x="0" y="0" class="hud-label">STATUS // PROD</text>
  </g>
  <g transform="translate(50, 410)">
    <text x="0" y="0" class="hud-label">STACK // HYBRID CLOUD</text>
  </g>
  <g transform="translate(1040, 410)">
    <text x="0" y="0" class="hud-label">LOC // INDIA 🇮🇳</text>
  </g>

  <!-- Scanner Light Beam -->
  <g class="scanner">
    <line x1="30" y1="0" x2="1170" y2="0" stroke="url(#glowRedGrad)" stroke-width="2.5" filter="url(#softGlow)" />
  </g>
</svg>
